[workspace]
resolver = "2"
members = ["crates/study-core", "crates/study-rime-sys", "crates/study-rime", "crates/study-android"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
jni = "=0.21.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

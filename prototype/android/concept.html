<style>
  #study-mobile-design { width: 100%; }
  #study-mobile-design .sc-stage { display: grid; place-items: center; padding: 24px 0 30px; }
  #study-mobile-design .sc-phone {
    --sc-paper: light-dark(#fbfcfa, #18221e);
    --sc-ink: light-dark(#24352e, #e4eee8);
    --sc-subtle: light-dark(#728078, #a0b0a6);
    --sc-line: light-dark(#e5ebe6, #35433a);
    --sc-keyboard: light-dark(#e8eeea, #202d25);
    --sc-key: light-dark(#ffffff, #35433a);
    --sc-function: light-dark(#d8e3dc, #2b3d31);
    --sc-accent: light-dark(#2d6b53, #acd5bb);
    --sc-tint: light-dark(#d6e7dc, #3b5141);
    --sc-on-accent: light-dark(#ffffff, #192d20);
    --sc-shadow: light-dark(#19382a20, #00000038);
    --sc-radius: 9px;
    width: min(100%, 390px); box-sizing: border-box; position: relative;
    border: 1px solid var(--sc-line); border-radius: 27px; overflow: hidden;
    background: var(--sc-paper); color: var(--sc-ink);
    box-shadow: 0 18px 44px light-dark(#23372c15, #00000028);
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; text-align: left;
  }
  #study-mobile-design .sc-phone * { box-sizing: border-box; }
  #study-mobile-design .sc-phone [hidden] { display: none !important; }
  #study-mobile-design .sc-phone button { font: inherit; color: inherit; border: 0; margin: 0; }
  #study-mobile-design .sc-phone p { margin: 0; }
  #study-mobile-design .sc-note-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px 1px; }
  #study-mobile-design .sc-note-label { display: flex; align-items: center; gap: 8px; color: var(--sc-subtle); font-size: 13px; }
  #study-mobile-design .sc-done { background: transparent; min-height: 42px; padding: 0 8px; color: var(--sc-accent) !important; font-weight: 600 !important; }
  #study-mobile-design .sc-note { padding: 13px 25px 24px; min-height: 170px; }
  #study-mobile-design .sc-note-title { font-size: 23px; letter-spacing: -.7px; font-weight: 600; line-height: 1.4; }
  #study-mobile-design .sc-date { margin-top: 7px !important; color: var(--sc-subtle); font-size: 11px; letter-spacing: .4px; }
  #study-mobile-design .sc-editor { margin-top: 21px !important; font-size: 17px; line-height: 1.85; overflow-wrap: anywhere; white-space: pre-wrap; }
  #study-mobile-design .sc-composition { color: var(--sc-accent); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  #study-mobile-design .sc-caret { display: inline-block; vertical-align: -.13em; height: 1.1em; width: 1.5px; margin-left: 2px; background: var(--sc-accent); }
  #study-mobile-design .sc-note-tail { font-size: 15px; line-height: 1.9; color: var(--sc-subtle); }
  #study-mobile-design .sc-ime { position: relative; padding: 0 5px 10px; background: var(--sc-keyboard); border-top: 1px solid var(--sc-line); }
  #study-mobile-design .sc-tools { display: flex; align-items: center; justify-content: space-between; min-height: 47px; padding: 0 10px; gap: 8px; }
  #study-mobile-design .sc-brand { display: flex; align-items: center; gap: 6px; color: var(--sc-accent); font-weight: 600; font-size: 13px; letter-spacing: 1px; }
  #study-mobile-design .sc-tool-actions { display: flex; align-items: center; gap: 1px; }
  #study-mobile-design .sc-icon { display: grid; place-items: center; width: 39px; height: 42px; padding: 0; border-radius: 12px; background: transparent; color: var(--sc-subtle) !important; }
  #study-mobile-design .sc-icon:active { background: var(--sc-function); }
  #study-mobile-design .sc-icon:disabled { opacity: .4; }
  #study-mobile-design .sc-learning { display: flex; gap: 6px; align-items: center; min-height: 42px; margin-left: 7px; font-size: 12px; color: var(--sc-accent); }
  #study-mobile-design .sc-learning input { appearance: none; margin: 0; width: 29px; height: 18px; border: 0; border-radius: 20px; background: var(--sc-function); position: relative; }
  #study-mobile-design .sc-learning input::after { content: ""; position: absolute; width: 12px; height: 12px; top: 3px; left: 3px; border-radius: 50%; background: var(--sc-subtle); transition: transform 160ms ease, background 160ms ease; }
  #study-mobile-design .sc-learning input:checked { background: var(--sc-accent); }
  #study-mobile-design .sc-learning input:checked::after { transform: translateX(11px); background: var(--sc-on-accent); }
  #study-mobile-design .sc-preedit { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 3px; min-height: 23px; }
  #study-mobile-design .sc-pinyin { color: var(--sc-accent); font-size: 13px; letter-spacing: .6px; }
  #study-mobile-design .sc-mode { font-size: 11px; color: var(--sc-subtle); }
  #study-mobile-design .sc-candidate-row { display: flex; padding: 0 3px 8px; min-height: 66px; }
  #study-mobile-design .sc-candidates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; flex: 1; min-width: 0; }
  #study-mobile-design .sc-candidate { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 7px 4px; min-width: 0; min-height: 55px; background: transparent; border-radius: 11px; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #study-mobile-design .sc-candidate:first-child { background: var(--sc-tint); }
  #study-mobile-design .sc-candidate:active { background: var(--sc-function); }
  #study-mobile-design .sc-en { display: block; width: 100%; max-height: 22px; margin-bottom: 3px; color: var(--sc-accent); font-size: 12px; line-height: 1.45; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 1; transition: max-height 180ms ease, opacity 140ms ease, margin 180ms ease; }
  #study-mobile-design .sc-zh { display: block; width: 100%; font-size: 20px; font-weight: 500; line-height: 1.4; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #study-mobile-design .sc-phone[data-learning="false"] .sc-en { max-height: 0; margin-bottom: 0; opacity: 0; }
  #study-mobile-design .sc-phone[data-learning="false"] .sc-candidate { min-height: 43px; }
  #study-mobile-design .sc-phone[data-learning="false"] .sc-candidate-row { min-height: 51px; }
  #study-mobile-design .sc-expand { width: 30px; flex: 0 0 30px; align-self: stretch; display: grid; place-items: center; background: transparent; border-radius: 9px; color: var(--sc-subtle) !important; }
  #study-mobile-design .sc-expand[aria-expanded="true"] > * { transform: rotate(180deg); }
  #study-mobile-design .sc-ready { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: var(--sc-subtle); font-size: 12px; letter-spacing: .6px; }
  #study-mobile-design .sc-board { padding-top: 1px; }
  #study-mobile-design .sc-key-row { display: flex; width: 100%; }
  #study-mobile-design .sc-key-row.sc-middle { padding: 0 4.8%; }
  #study-mobile-design .sc-key { display: flex; flex: 1; align-items: stretch; justify-content: center; height: 52px; padding: 3px; min-width: 0; background: transparent; touch-action: manipulation; user-select: none; }
  #study-mobile-design .sc-keyface { display: grid; align-items: center; justify-items: center; width: 100%; min-width: 0; background: var(--sc-key); border-radius: var(--sc-radius); box-shadow: 0 1.5px 1px var(--sc-shadow); font-size: 20px; font-weight: 400; line-height: 1; transition: transform 75ms ease, background 75ms ease; }
  #study-mobile-design .sc-key:active .sc-keyface { transform: translateY(1.5px) scale(.96); background: var(--sc-tint); box-shadow: none; }
  #study-mobile-design .sc-key.sc-fn { flex: 1.45; }
  #study-mobile-design .sc-key.sc-fn .sc-keyface { background: var(--sc-function); font-size: 13px; font-weight: 500; }
  #study-mobile-design .sc-key.sc-space { flex: 4.6; }
  #study-mobile-design .sc-key.sc-space .sc-keyface { font-size: 12px; color: var(--sc-subtle); letter-spacing: 2px; }
  #study-mobile-design .sc-key.sc-return { flex: 1.55; }
  #study-mobile-design .sc-key.sc-return .sc-keyface { background: var(--sc-accent); color: var(--sc-on-accent); }
  #study-mobile-design .sc-key[aria-pressed="true"] .sc-keyface { background: var(--sc-tint); color: var(--sc-accent); }
  #study-mobile-design .sc-phone[data-key-style="flat"] .sc-keyface { background: transparent; box-shadow: none; }
  #study-mobile-design .sc-phone[data-key-style="flat"] .sc-key.sc-fn .sc-keyface { background: var(--sc-function); }
  #study-mobile-design .sc-phone[data-key-style="flat"] .sc-key.sc-return .sc-keyface { background: var(--sc-accent); }
  #study-mobile-design .sc-phone[data-key-style="flat"] .sc-key:active .sc-keyface { background: var(--sc-tint); }
  #study-mobile-design .sc-gesture { height: 4px; width: 89px; margin: 17px auto 1px; border-radius: 9px; background: var(--sc-ink); opacity: .45; }
  #study-mobile-design .sc-definition { position: absolute; z-index: 5; bottom: calc(100% - 46px); left: 12px; right: 12px; padding: 17px 18px; background: var(--sc-paper); border: 1px solid var(--sc-line); border-radius: 19px; box-shadow: 0 12px 32px var(--sc-shadow); }
  #study-mobile-design .sc-definition-head { display: flex; justify-content: space-between; align-items: center; }
  #study-mobile-design .sc-definition-title { font-size: 15px; font-weight: 600; }
  #study-mobile-design .sc-definition-word { margin: 4px 0 5px !important; font-size: 28px; letter-spacing: -.7px; line-height: 1.25; overflow-wrap: anywhere; color: var(--sc-accent); }
  #study-mobile-design .sc-definition-label { color: var(--sc-subtle); font-size: 11px; }
  #study-mobile-design .sc-commit-en { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--sc-accent); color: var(--sc-on-accent) !important; width: 100%; min-height: 43px; border-radius: 11px; margin-top: 15px !important; font-size: 13px !important; }
  #study-mobile-design .sc-a11y { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 430px) {
    #study-mobile-design .sc-stage { padding-top: 53px; }
    #study-mobile-design .sc-phone { border-radius: 23px; }
    #study-mobile-design .sc-note { padding-left: 20px; padding-right: 20px; }
    #study-mobile-design .sc-key { padding: 2.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #study-mobile-design .sc-phone * { transition: none !important; }
  }
</style>
<div id="study-mobile-design">
  <div class="sc-stage viz-dotted-background">
    <section class="sc-phone" aria-label="拾词手机键盘 · 清浅绿" data-learning="true" data-key-style="soft">
      <div class="sc-note-header">
        <span class="sc-note-label"><i data-lucide="chevron-left" aria-hidden="true"></i>随手记</span>
        <button class="sc-done cursor-interaction" type="button" data-action="done">完成</button>
      </div>
      <div class="sc-note">
        <div class="sc-note-title">周末的小计划</div>
        <p class="sc-date">11 月 8 日 · 今天</p>
        <p class="sc-editor" aria-live="polite">下午去附近的<span data-output></span><span class="sc-composition" data-composition>gongyuan</span><span class="sc-caret" aria-hidden="true"></span></p>
        <p class="sc-note-tail">带上相机，慢慢走。</p>
      </div>
      <div class="sc-ime">
        <div class="sc-tools">
          <div class="sc-brand"><i data-lucide="sprout" aria-hidden="true"></i>拾词</div>
          <div class="sc-tool-actions">
            <button class="sc-icon cursor-interaction" type="button" data-action="theme" aria-label="切换浅色与深色外观"><i data-lucide="sun-moon" aria-hidden="true"></i></button>
            <button class="sc-icon cursor-interaction" type="button" data-action="definition" aria-label="查看当前候选的完整释义"><i data-lucide="book-open-text" aria-hidden="true"></i></button>
            <label class="sc-learning cursor-interaction">英语<input class="cursor-interaction" type="checkbox" role="switch" aria-label="显示英文释义" checked></label>
          </div>
        </div>
        <div class="sc-preedit"><span class="sc-pinyin" data-pinyin>gong'yuan</span><span class="sc-mode" data-mode>全拼</span></div>
        <div class="sc-candidate-row">
          <div class="sc-candidates" role="group" aria-label="候选词，点击输入中文，长按查看英文">
            <button class="sc-candidate cursor-interaction" type="button" data-candidate="0" aria-label="公园，park。点击输入中文，长按查看释义"><span class="sc-en">park</span><span class="sc-zh">公园</span></button>
            <button class="sc-candidate cursor-interaction" type="button" data-candidate="1" aria-label="公元，AD。点击输入中文，长按查看释义"><span class="sc-en">AD</span><span class="sc-zh">公元</span></button>
            <button class="sc-candidate cursor-interaction" type="button" data-candidate="2" aria-label="贡院，exam hall。点击输入中文，长按查看释义"><span class="sc-en">exam hall</span><span class="sc-zh">贡院</span></button>
          </div>
          <button class="sc-expand cursor-interaction" type="button" data-action="expand" aria-label="展开候选" aria-expanded="false"><i data-lucide="chevron-down" aria-hidden="true"></i></button>
        </div>
        <div class="sc-board" role="group" aria-label="26 键键盘"></div>
        <div class="sc-gesture" aria-hidden="true"></div>
        <div class="sc-definition" role="dialog" aria-label="候选词英文释义" hidden>
          <div class="sc-definition-head"><span class="sc-definition-title" data-definition-zh></span><button class="sc-icon cursor-interaction" type="button" data-action="close" aria-label="关闭释义"><i data-lucide="x" aria-hidden="true"></i></button></div>
          <p class="sc-definition-word" data-definition-en></p>
          <span class="sc-definition-label">常用释义</span>
          <button class="sc-commit-en cursor-interaction" type="button" data-action="commit-en">输入英文<i data-lucide="corner-down-left" aria-hidden="true"></i></button>
        </div>
      </div>
      <span class="sc-a11y">交互设计示意，候选使用固定示例数据。可切换外观、英语显示，点击或长按候选。</span>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('study-mobile-design');
  const phone = root.querySelector('.sc-phone');
  const candidateBox = root.querySelector('.sc-candidates');
  const board = root.querySelector('.sc-board');
  const definition = root.querySelector('.sc-definition');
  const learningInput = root.querySelector('.sc-learning input');
  const state = { theme: 'auto', radius: 9, keyStyle: 'soft', learning: true, accent: '#2d6b53' };
  const session = { input: 'gongyuan', output: '', english: false, symbols: false, shift: false, expanded: false, target: null };
  const examples = {
    gongyuan: [['公园', 'park'], ['公元', 'AD'], ['贡院', 'exam hall'], ['宫苑', 'palace gardens']],
    nihao: [['你好', 'hello']],
    xuexi: [['学习', 'learn']],
    pengyou: [['朋友', 'friend']],
    shijie: [['世界', 'world'], ['时节', 'season'], ['师姐', 'senior fellow student']],
    mingtian: [['明天', 'tomorrow']],
    pingguo: [['苹果', 'apple']],
    kafei: [['咖啡', 'coffee']]
  };
  let keyboardSignature = '';
  let candidateSignature = '';
  let holdTimer = null;
  let didHold = false;
  function candidates() {
    if (session.english || !session.input) return [];
    return examples[session.input.toLowerCase().replace(/'/g, '')] || [[session.input, '']];
  }
  function restore(snapshot) {
    const saved = snapshot && snapshot.modelContent;
    if (!saved || saved.design !== 'study-mobile') return;
    if (['auto', 'light', 'dark'].includes(saved.theme)) state.theme = saved.theme;
    if (['soft', 'flat'].includes(saved.keyStyle)) state.keyStyle = saved.keyStyle;
    if (typeof saved.learning === 'boolean') state.learning = saved.learning;
    if (typeof saved.radius === 'number') state.radius = Math.max(4, Math.min(15, saved.radius));
    if (typeof saved.accent === 'string' && /^#[0-9a-f]{6}$/i.test(saved.accent)) state.accent = saved.accent;
  }
  function save() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({ modelContent: { design: 'study-mobile', theme: state.theme, radius: state.radius, keyStyle: state.keyStyle, learning: state.learning, accent: state.accent }, privateContent: null }).catch(() => {});
    }
  }
  function createKey(value, label, className, icon) {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'sc-key cursor-interaction ' + (className || '');
    button.dataset.key = value; button.setAttribute('aria-label', label);
    const face = document.createElement('span'); face.className = 'sc-keyface';
    if (icon) { const mark = document.createElement('i'); mark.dataset.lucide = icon; mark.setAttribute('aria-hidden', 'true'); face.append(mark); }
    else face.textContent = label;
    if (value === 'shift') button.setAttribute('aria-pressed', String(session.shift));
    button.append(face); return button;
  }
  function renderKeyboard() {
    const signature = [session.symbols, session.shift, session.english].join('-');
    if (signature === keyboardSignature) return;
    keyboardSignature = signature; board.replaceChildren();
    const rows = session.symbols ? ['1234567890', '@#%&*()-+', ',!?;:./'] : ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
    rows.forEach((letters, rowIndex) => {
      const row = document.createElement('div'); row.className = 'sc-key-row' + (rowIndex === 1 ? ' sc-middle' : '');
      if (rowIndex === 2) row.append(createKey('shift', session.shift ? '关闭大写' : '大写', 'sc-fn', 'arrow-up'));
      Array.from(letters).forEach(letter => row.append(createKey(letter, session.shift && !session.symbols ? letter.toUpperCase() : letter)));
      if (rowIndex === 2) row.append(createKey('delete', '删除', 'sc-fn', 'delete'));
      board.append(row);
    });
    const last = document.createElement('div'); last.className = 'sc-key-row';
    last.append(createKey('symbols', session.symbols ? 'ABC' : '?123', 'sc-fn'));
    last.append(createKey('language', session.english ? '英/中' : '中/英', 'sc-fn'));
    last.append(createKey('space', session.english ? 'space' : '拾词', 'sc-space'));
    last.append(createKey('period', session.english ? '.' : '。', 'sc-fn'));
    last.append(createKey('enter', '换行', 'sc-return', 'corner-down-left'));
    board.append(last);
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  }
  function renderCandidates() {
    const choices = candidates();
    const signature = JSON.stringify([choices, session.expanded, session.english]);
    if (signature !== candidateSignature) {
      candidateSignature = signature; candidateBox.replaceChildren();
      choices.slice(0, session.expanded ? choices.length : 3).forEach((choice, index) => {
        const button = document.createElement('button'); button.type = 'button';
        button.className = 'sc-candidate cursor-interaction'; button.dataset.candidate = String(index);
        button.setAttribute('aria-label', choice[0] + (choice[1] ? '，' + choice[1] : '') + '。点击输入中文，长按查看释义');
        button.dataset.tooltip = choice[0] + (choice[1] ? ' · ' + choice[1] : '');
        const en = document.createElement('span'); en.className = 'sc-en'; en.textContent = choice[1] || ' ';
        const zh = document.createElement('span'); zh.className = 'sc-zh'; zh.textContent = choice[0];
        button.append(en, zh); candidateBox.append(button);
      });
      if (!choices.length) { const quiet = document.createElement('span'); quiet.className = 'sc-ready'; quiet.textContent = session.english ? 'English' : '自在输入，随手拾词'; candidateBox.append(quiet); }
    }
    const expand = root.querySelector('[data-action="expand"]');
    expand.hidden = choices.length < 4; expand.setAttribute('aria-expanded', String(session.expanded));
    expand.setAttribute('aria-label', session.expanded ? '收起候选' : '展开候选');
    root.querySelector('[data-action="definition"]').disabled = !state.learning || !choices[0] || !choices[0][1];
  }
  function render() {
    phone.style.colorScheme = state.theme === 'auto' ? '' : state.theme;
    phone.style.setProperty('--sc-radius', state.radius + 'px');
    const rgb = [1, 3, 5].map(index => parseInt(state.accent.slice(index, index + 2), 16));
    const lightInk = rgb[0] * .299 + rgb[1] * .587 + rgb[2] * .114 > 158 ? '#162c20' : '#ffffff';
    phone.style.setProperty('--sc-accent', 'light-dark(' + state.accent + ', color-mix(in srgb, ' + state.accent + ' 28%, #dceee1))');
    phone.style.setProperty('--sc-on-accent', 'light-dark(' + lightInk + ', #192d20)');
    phone.dataset.keyStyle = state.keyStyle; phone.dataset.learning = String(state.learning);
    learningInput.checked = state.learning;
    root.querySelector('[data-output]').textContent = session.output;
    root.querySelector('[data-composition]').textContent = session.input;
    root.querySelector('[data-pinyin]').textContent = session.input === 'gongyuan' ? "gong'yuan" : session.input || ' ';
    root.querySelector('[data-mode]').textContent = session.english ? '英文' : '全拼';
    if (!state.learning) session.target = null;
    definition.hidden = !session.target;
    if (session.target) {
      root.querySelector('[data-definition-zh]').textContent = session.target.zh;
      root.querySelector('[data-definition-en]').textContent = session.target.en;
    }
    renderKeyboard(); renderCandidates();
  }
  function commit(value) {
    session.output += value; session.input = ''; session.target = null; session.expanded = false;
  }
  function commitFirst() {
    const choices = candidates();
    if (session.input) commit(choices[0] ? choices[0][0] : session.input);
  }
  function inspect(index) {
    const choice = candidates()[index];
    if (!state.learning || !choice || !choice[1]) return;
    session.target = { zh: choice[0], en: choice[1], input: session.input }; render();
  }
  function handleKey(key) {
    session.target = null;
    if (key === 'delete') {
      if (session.input) session.input = Array.from(session.input).slice(0, -1).join('');
      else session.output = Array.from(session.output).slice(0, -1).join('');
    } else if (key === 'shift') session.shift = !session.shift;
    else if (key === 'symbols') session.symbols = !session.symbols;
    else if (key === 'language') { commitFirst(); session.english = !session.english; }
    else if (key === 'space') { if (session.input) commitFirst(); else session.output += ' '; }
    else if (key === 'enter') { commitFirst(); session.output += String.fromCharCode(10); }
    else if (key === 'period') { commitFirst(); session.output += session.english ? '.' : '。'; }
    else if (session.english || session.symbols) { commitFirst(); session.output += session.shift ? key.toUpperCase() : key; }
    else session.input += key.toLowerCase();
    session.expanded = false; render();
  }
  root.addEventListener('click', event => {
    const key = event.target.closest('[data-key]');
    if (key) { handleKey(key.dataset.key); return; }
    const candidate = event.target.closest('[data-candidate]');
    if (candidate) {
      if (didHold) { didHold = false; return; }
      const choice = candidates()[Number(candidate.dataset.candidate)];
      if (choice) { commit(choice[0]); render(); }
      return;
    }
    const action = event.target.closest('[data-action]');
    if (!action) return;
    if (action.dataset.action === 'theme') {
      const scheme = getComputedStyle(phone).colorScheme;
      const currentDark = state.theme === 'dark' || (state.theme === 'auto' && (scheme === 'dark' || (scheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)));
      state.theme = currentDark ? 'light' : 'dark'; save();
    } else if (action.dataset.action === 'definition') inspect(0);
    else if (action.dataset.action === 'expand') session.expanded = !session.expanded;
    else if (action.dataset.action === 'close') session.target = null;
    else if (action.dataset.action === 'done') commitFirst();
    else if (action.dataset.action === 'commit-en') {
      const target = session.target;
      if (target && state.learning && target.input === session.input && candidates().some(choice => choice[0] === target.zh && choice[1] === target.en)) commit(target.en);
    }
    render();
  });
  candidateBox.addEventListener('pointerdown', event => {
    const button = event.target.closest('[data-candidate]'); if (!button) return;
    didHold = false; const input = session.input; const index = Number(button.dataset.candidate);
    holdTimer = setTimeout(() => { if (session.input === input && state.learning && candidates()[index] && candidates()[index][1]) { didHold = true; inspect(index); } }, 450);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(name => candidateBox.addEventListener(name, () => { clearTimeout(holdTimer); holdTimer = null; }));
  candidateBox.addEventListener('contextmenu', event => {
    const button = event.target.closest('[data-candidate]'); if (!button) return;
    event.preventDefault(); clearTimeout(holdTimer); inspect(Number(button.dataset.candidate));
  });
  learningInput.addEventListener('change', () => { state.learning = learningInput.checked; session.target = null; render(); save(); });
  root.addEventListener('keydown', event => { if (event.key === 'Escape' && session.target) { session.target = null; render(); } });
  window.addEventListener('openai:set_globals', event => { const globals = event.detail && event.detail.globals; if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) { restore(globals.widgetState); render(); } });
  restore(window.openai && window.openai.widgetState); render();
  if (globalThis.Tweak) {
    const tweak = new globalThis.Tweak({ container: phone, onChange: () => { render(); save(); } });
    tweak.addSelect(state, 'keyStyle', { label: '按键质感', options: [{ label: '柔和凸起', value: 'soft' }, { label: '整面平整', value: 'flat' }] });
    tweak.addSlider(state, 'radius', { label: '按键圆角', min: 4, max: 15, unit: 'px' });
    tweak.addColorPicker(state, 'accent', { label: '强调色', reference: '--sc-accent' });
  }
})();
</script>

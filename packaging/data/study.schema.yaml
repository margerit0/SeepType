__include: luna_pinyin_simp.schema:/
schema:
  schema_id: study
  name: 拾词全拼
  version: '0.5.2'
  # Deploy both prisms even for an existing user's single-schema default.custom.
  dependencies: [study_double_pinyin, study_flypy]
switches:
  - {name: ascii_mode, reset: 0}
  - {name: full_shape, reset: 0}
  - {name: zh_simp, reset: 1}
  - {name: ascii_punct, reset: 0}
  - {name: learning_mode, reset: 1}
engine:
  processors:
    - lua_processor@study_keys
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier
    - lua_filter@study_filter
translator:
  dictionary: cedict_study
  user_dict: cedict_study
  prism: study
  enable_user_dict: true
recognizer:
  patterns:
    reverse_lookup: ''
menu:
  page_size: 5
